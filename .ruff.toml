line-length = 250

[lint]
# Pin the rule set explicitly. Without `select`, ruff uses its built-in
# defaults, which grew from ~50 to ~400 rules in ruff 0.17. environment.yml
# does not pin ruff, so CI would silently start checking different rules.
# E4/E7/E9/F are the pre-0.17 defaults.
select = ["E4", "E7", "E9", "F"]
ignore = ["F403","F405","F401","E731","E402","F841","E721","F541"]
